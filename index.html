  <link rel="preload" href="assets/fonts/noto-sans-sc-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    (function () {
      var theme = "light";
      var lang = "zh";
      try {
        var savedTheme = localStorage.getItem("jaxx-theme");
        var savedLang = localStorage.getItem("jaxx-lang");
        if (savedTheme === "dark" || savedTheme === "light") theme = savedTheme;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        if (savedLang === "en" || savedLang === "zh") lang = savedLang;
      } catch (error) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.setAttribute("data-lang", lang);
      root.lang = lang === "en" ? "en" : "zh-CN";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0b0d12" : "#f3efe6");
    })();
  </script>
</head>
